<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<link rel="stylesheet" href="style.css">

<body>
<div id="root"><div class="boot">Opening…</div></div>
<!-- Order matters: the runtime inlines each <script src> as a classic script.
     shim.js is a memory localStorage so the engine never throws on the opaque
     origin; vendor/excalidraw.js is the engine (React + Excalidraw);
     strings.js the English words; collab.js shares the board with the room;
     export.js writes the files; app.js joins them and adds the workshop tools. -->
<script src="shim.js"></script>
<script src="vendor/excalidraw.js"></script>
<script src="strings.js"></script>
<script src="collab.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
