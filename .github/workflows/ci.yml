# App suites only. This repo does not deploy the site.
name: Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 2048 packs with js/gifos-gif.js from the site checkout. Cone mode
      # takes the js directory; a file path is rejected as "not a directory".
      - name: Site codec
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nwcnwc/gifos-app.git ../gifos-app
          git -C ../gifos-app sparse-checkout set js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # gltf-viewer/test.js parses the page's inline scripts with acorn.
      - name: Script parser
        run: npm install --prefix "$RUNNER_TEMP/parser" --no-audit --no-fund acorn@8.18.0
      - run: node test-all.js
        env:
          NODE_PATH: ${{ runner.temp }}/parser/node_modules
